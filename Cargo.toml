[workspace]

[package]
name = "yadr"
version = "0.5.0"
edition = "2021"
# Set by `ra_ap_syntax`, which is rust-analyzer's parser and tracks the compiler closely; it has
# required the then-current stable release at every version we've used. In practice that makes
# yadr's MSRV "latest stable", so treat a bump here as routine rather than as a policy change.
rust-version = "1.95.0"
description = "Command-line tool for accessing Y-Statement-style ADRs in code comments."
authors = ["jon.gjengset@helsing.ai"]
repository = "https://github.com/helsing-ai/yadr"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["adr", "architecture", "documentation", "y-statement", "comments"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "yadr"
path = "src/main.rs"

[dependencies]
camino = "1.1.6"
clap = { version = "4.5.4", features = ["derive"] }
ignore = "0.4.22"
# We only ever deal in civil dates (YYYY-MM-DD), never in wall-clock times or
# time zones, so jiff's default features -- which bundle a copy of the tz
# database and add platform-specific system-time-zone detection -- are all dead
# weight here. Do not restore the defaults without a reason to.
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
miette = { version = "7.2.0", features = ["fancy"] }
ra_ap_syntax = "0.0.345"
regex = "1.10.4"
streaming-iterator = "0.1.9"
tree-sitter = "0.26.0"
tree-sitter-nix = "0.3.0"
tree-sitter-python = "0.25.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.38.0"
predicates = "3.1.4"
